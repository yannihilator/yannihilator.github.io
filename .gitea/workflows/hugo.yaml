# Workflow for building and deploying the Hugo site to the VPS that hosts my portfolio
name: Deploy Portfolio to VPS

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    # GitHub-hosted runners automatically enable `set -eo pipefail` for Bash shells.
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-22.04
    env:
      DART_SASS_VERSION: 1.89.2
      HUGO_VERSION: 0.148.0
      HUGO_ENVIRONMENT: production
      TZ: America/New_York
    steps:
      - run: whoami
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      # - name: Setup Pages
      #   id: pages
      #   uses: actions/configure-pages@v5
      # - name: Install Node.js dependencies
      #   run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      # - name: Cache Restore
      #   id: cache-restore
      #   uses: actions/cache/restore@v4
      #   with:
      #     path: |
      #       ${{ runner.temp }}/hugo_cache
      #     key: hugo-${{ gitea.run_id }}
      #     restore-keys:
      #       hugo-
      # - name: Configure Git
      #   run: git config core.quotepath false
      - name: Build with Hugo
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"
      # - name: Cache Save
      #   id: cache-save
      #   uses: actions/cache/save@v4
      #   with:
      #     path: |
      #       ${{ runner.temp }}/hugo_cache
      #     key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      - name: Upload artifact
        # uses: actions/upload-artifact@v4
        uses: https://github.com/christopherHX/gitea-upload-artifact@v4
        with:
          name: site
          path: ./public/

  # Deployment job
  deploy:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Download Artifact
        uses: https://github.com/christopherHX/gitea-download-artifact@v4
        with:
          name: site
          path: ./public/
      - name: Deploy to VPS
        id: deployment
        run: |
          # SCP over all of the files to the VPS.
          scp -r ./public vps:/home/blogga/blog
          # SSH into the VPS and restart Nginx.
